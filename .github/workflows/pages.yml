name: Paper website

on:
  push:
    paths:
      - "website/**"
      - "notebooks/**"
      - "code/**"
      - "data/raw/**"
      - "data/generated/**"
      - ".here"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.6.40"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::sessioninfo
          extra-packages: tidyverse, here, igraph, lfe, ggraph, patchwork, scales, knitr, rmarkdown
          dependencies: '"hard"'
          install-quarto: false
      - name: Build paper website and rendered analyses
        run: quarto render notebooks
      - uses: actions/upload-pages-artifact@v4
        with:
          path: notebooks/_site
          retention-days: 7

  deploy:
    if: github.ref_name == github.event.repository.default_branch && github.event.repository.private == false
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
